name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    env:
      TERRAFORM_DOCS_VERSION: v0.24.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.2
          tofu_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Setup terraform-docs
        run: |
          curl -fsSL "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin terraform-docs

      - name: Format, validate, lint, docs, test
        run: make check
